project:
  type: website
  output-dir: .
  pre-render: wkd.py
  # Only the notes are Quarto sources; the top-level pages are hand-written HTML.
  render:
    - notes/*.qmd

website:
  title: "Notes"
  navbar:
    title: "Notes"
    left:
      - href: notes/index.qmd
        text: Home

format:
  html:
    theme: cosmo
    html-math-method: katex
    mermaid:
      theme: default
