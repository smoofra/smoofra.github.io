project:
  type: website
  output-dir: .
  pre-render: wkd.py
  # Only the notes are Quarto sources; the top-level pages are hand-written HTML.
  render:
    - notes/*.qmd

website:
  title: "Notes"
  navbar:
    title: "Notes"
    # The title links to the site root by default, but the root is the
    # hand-written home page, not the notes.
    logo-href: /notes/index.html
    left:
      - href: index.html
        text: Home

format:
  html:
    theme: cosmo
    html-math-method: katex
    mermaid:
      theme: default
